{% load i18n %}
{% get_current_language as current_language %}
<form class="language-selector" action="{% url 'set_language' %}" method="post">
  {% csrf_token %}<input type="hidden" name="next" value="{{ request.get_full_path }}">
  <label class="visually-hidden" for="site-language">{% translate "Language" %}</label>
  <select id="site-language" name="language">
    {% for code, name in site_languages %}<option value="{{ code }}" lang="{{ code }}"{% if code == current_language %} selected{% endif %}>{{ name }}</option>{% endfor %}
  </select>
  <button type="submit">{% translate "Apply" %}</button>
</form>
