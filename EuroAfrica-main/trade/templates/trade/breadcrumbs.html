{% load i18n %}<nav class="breadcrumbs wrap" aria-label="{% translate 'Breadcrumb' %}"><ol>{% for label,path in breadcrumbs %}<li>{% if not forloop.last %}<a href="{{ path }}">{% translate label %}</a>{% else %}<span aria-current="page">{% translate label %}</span>{% endif %}</li>{% endfor %}</ol></nav>
